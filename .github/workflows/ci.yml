name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Notes on what is deliberately NOT here:
# - `nix flake check` cannot run on macOS: evaluating the x86_64-linux
#   homeConfigurations.shuo output triggers Linux-only import-from-derivation
#   builds. The build matrix below covers the darwinConfigurations instead.
# - There is no separate Home Manager validation job: with useGlobalPkgs /
#   useUserPackages, the HM generation is part of the darwin system closure,
#   so building the system already builds it.

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v21

      - name: Check formatting with nixfmt
        run: nix run nixpkgs#nixfmt -- --check flake.nix home.nix hosts/ modules/

      - name: Run statix linter
        run: nix run nixpkgs#statix -- check .

      - name: Run deadnix to find unused code
        run: nix run nixpkgs#deadnix -- --fail .

  build:
    name: Build Darwin System
    runs-on: macos-latest
    strategy:
      matrix:
        host:
          - Shuos-MacBook-Pro
          - Shuos-MacBook-Pro-Lumaril
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v21
        with:
          extra-conf: |
            accept-flake-config = true
            system = aarch64-darwin

      - name: Build Darwin configuration
        run: |
          nix build .#darwinConfigurations.${{ matrix.host }}.system \
            --no-link \
            --print-build-logs \
            --system aarch64-darwin
