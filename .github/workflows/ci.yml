name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    name: Check Nix Flake
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v21
        with:
          extra-conf: |
            accept-flake-config = true

      - name: Check Nix flake
        run: nix flake check --no-build

      - name: Check formatting
        run: |
          nix run nixpkgs#nixfmt-rfc-style -- --check flake.nix
          nix run nixpkgs#nixfmt-rfc-style -- --check home.nix
          nix run nixpkgs#nixfmt-rfc-style -- --check hosts/
          nix run nixpkgs#nixfmt-rfc-style -- --check modules/

  build:
    name: Build Darwin System
    runs-on: macos-latest
    strategy:
      matrix:
        host:
          - Shuos-MacBook-Pro
          - Shuos-MacBook-Pro-Lumaril
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v21
        with:
          extra-conf: |
            accept-flake-config = true
            system = aarch64-darwin

      - name: Build Darwin configuration
        run: |
          nix build .#darwinConfigurations.${{ matrix.host }}.system \
            --no-link \
            --print-build-logs \
            --system aarch64-darwin

  validate-home-manager:
    name: Validate Home Manager Configuration
    runs-on: macos-latest
    strategy:
      matrix:
        host:
          - Shuos-MacBook-Pro
          - Shuos-MacBook-Pro-Lumaril
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v21
        with:
          extra-conf: |
            accept-flake-config = true

      - name: Validate Home Manager configuration
        run: |
          nix build .#darwinConfigurations.${{ matrix.host }}.config.home-manager.users.shuo.home.activationPackage \
            --no-link \
            --print-build-logs

  update-flake-lock:
    name: Update flake.lock
    runs-on: macos-latest
    if: github.event_name == 'schedule'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v21

      - name: Update flake.lock
        uses: DeterminateSystems/update-flake-lock@v28
        with:
          pr-title: "chore: update flake.lock"
          pr-labels: |
            dependencies
            automated
