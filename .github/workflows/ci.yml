name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Notes on what is deliberately NOT here:
# - `nix flake check` cannot run on macOS: evaluating the x86_64-linux
#   homeConfigurations.shuo output triggers Linux-only import-from-derivation
#   builds. The build matrix below covers the darwinConfigurations instead.
# - There is no separate Home Manager validation job: with useGlobalPkgs /
#   useUserPackages, the HM generation is part of the darwin system closure,
#   so building the system already builds it.

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Check formatting with nixfmt
        run: nix run nixpkgs#nixfmt -- --check flake.nix home.nix hosts/ modules/

      - name: Run statix linter
        run: nix run nixpkgs#statix -- check .

      - name: Run deadnix to find unused code
        run: nix run nixpkgs#deadnix -- --fail .

  build:
    name: Build Darwin System
    runs-on: macos-latest
    strategy:
      matrix:
        host:
          - Shuos-MacBook-Pro
          - Shuos-MacBook-Pro-Lumaril
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          extra-conf: |
            accept-flake-config = true
            system = aarch64-darwin

      # Pushes everything built in this job to the shzhng cachix cache so
      # later runs (and the laptops) substitute instead of rebuilding.
      # Without CACHIX_AUTH_TOKEN (e.g. dependabot runs) the push is skipped
      # and the cache is still used read-only via the flake's nixConfig.
      - name: Setup Cachix
        uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: shzhng
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Build Darwin configuration
        run: |
          nix build .#darwinConfigurations.${{ matrix.host }}.system \
            --no-link \
            --print-build-logs \
            --system aarch64-darwin
