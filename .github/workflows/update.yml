name: Update Dependencies

# Renovate is the primary flake updater (renovate.json enables the nix
# manager; inputs are grouped into one weekly "flake inputs" PR that, unlike
# PRs from this workflow's GITHUB_TOKEN, actually triggers CI). This workflow
# is kept as a manual fallback — dispatch it if Renovate's nix support (beta,
# runs on the hosted app) fails; failures show on the Dependency Dashboard.
# Note: PRs created here use GITHUB_TOKEN, which GitHub blocks from
# triggering other workflows — close & reopen the PR to run CI on it.

on:
  workflow_dispatch:

jobs:
  update:
    name: Update flake.lock
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          extra-conf: |
            accept-flake-config = true

      - name: Update flake.lock
        uses: DeterminateSystems/update-flake-lock@834c491b2ece4de0bbd00d85214bb5e83b4da5c6 # v28
        with:
          pr-title: "chore: update flake inputs"
          pr-body: |
            Manually dispatched update of all flake.lock inputs (fallback for
            Renovate's nix manager).

            CI does not run on this PR automatically (it was created with
            GITHUB_TOKEN); close & reopen it, or push to the branch, to
            trigger the build before merging.
          pr-labels: |
            dependencies
            automated
