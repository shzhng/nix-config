name: Update Dependencies

# Renovate is the primary flake updater: renovate.json enables the nix
# manager's lock file maintenance, which runs `nix flake update` and opens one
# weekly "chore(flake): update flake inputs" PR (unlike PRs from this
# workflow's GITHUB_TOKEN, it triggers CI). Inputs without a pinned rev are
# only ever updated by lock file maintenance, so keep that enabled. This
# workflow is kept as a manual fallback — dispatch it if Renovate's nix
# support fails; failures show on the Dependency Dashboard.
# Note: PRs created here use GITHUB_TOKEN, which GitHub blocks from
# triggering other workflows — close & reopen the PR to run CI on it.

on:
  workflow_dispatch:

jobs:
  update:
    name: Update flake.lock
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        with:
          extra-conf: |
            accept-flake-config = true

      - name: Update flake.lock
        uses: DeterminateSystems/update-flake-lock@da03c0f078bc4b2c37ee4f7e072d34bf8f188bb3 # v29
        with:
          pr-title: "chore: update flake inputs"
          pr-body: |
            Manually dispatched update of all flake.lock inputs (fallback for
            Renovate's nix manager).

            CI does not run on this PR automatically (it was created with
            GITHUB_TOKEN); close & reopen it, or push to the branch, to
            trigger the build before merging.
          pr-labels: |
            dependencies
            automated
