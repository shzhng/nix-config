name: Update Dependencies

on:
  schedule:
    # Update llm-agents biweekly on Monday at 3am UTC (fast-moving agent tools)
    - cron: '0 3 * * 1/2'
    # Update everything (including nixpkgs) weekly on Thursday at 3am UTC
    - cron: '0 3 * * 4'
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  update:
    name: Update flake.lock
    runs-on: macos-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          extra-conf: |
            accept-flake-config = true

      - name: Update flake.lock
        uses: DeterminateSystems/update-flake-lock@834c491b2ece4de0bbd00d85214bb5e83b4da5c6 # v28
        with:
          pr-title: "chore: update flake inputs"
          pr-body: |
            Automated update of flake.lock inputs.

            - `llm-agents` updates biweekly (fast-moving agent tools)
            - All other inputs (including nixpkgs) update weekly

            Please review the changes and ensure everything builds correctly before merging.
          pr-labels: |
            dependencies
            automated
