name: Update Dependencies

# Renovate handles GitHub Actions digest pins (renovate.json); this workflow
# owns flake.lock. PRs created here use GITHUB_TOKEN, which GitHub blocks from
# triggering other workflows — close & reopen the PR (or push to its branch)
# to run CI on it.

on:
  schedule:
    # Update all flake inputs weekly on Monday at 3am UTC
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  update:
    name: Update flake.lock
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          extra-conf: |
            accept-flake-config = true

      - name: Update flake.lock
        uses: DeterminateSystems/update-flake-lock@834c491b2ece4de0bbd00d85214bb5e83b4da5c6 # v28
        with:
          pr-title: "chore: update flake inputs"
          pr-body: |
            Automated weekly update of all flake.lock inputs.

            CI does not run on this PR automatically (it was created with
            GITHUB_TOKEN); close & reopen it, or push to the branch, to
            trigger the build before merging.
          pr-labels: |
            dependencies
            automated
